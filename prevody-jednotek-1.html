<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Převody jednotek – test 1</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --ink: #222; --muted: #6b6b6b;
    --accent: #2f6fdd; --ok: #1f9d55; --bad: #d64545; --line: #e3e0d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  header a { color: var(--accent); text-decoration: none; }
  h1 { font-size: 1.6rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  section {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 16px;
  }
  h2 { font-size: 1.15rem; margin: 0 0 4px; }
  .hint { color: var(--muted); font-size: .95rem; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .item {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 8px 10px; border-radius: 10px; border: 2px solid transparent; background: #faf9f6;
  }
  .item.word { display: block; }
  .item.word p { margin: 0 0 8px; }
  .item.ok { border-color: var(--ok); background: #eefaf2; }
  .item.bad { border-color: var(--bad); background: #fdf0f0; }
  .letter { font-weight: 600; margin-right: 2px; }
  input, select {
    font: inherit; width: 96px; padding: 6px 8px; border: 1px solid #bbb; border-radius: 8px;
    background: #fff; text-align: center;
  }
  select { width: 72px; }
  input.wide { width: 120px; }
  .fix { margin-left: 4px; color: var(--bad); font-size: .95rem; width: 100%; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 24px; }
  button {
    font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.secondary { background: #e7e4dc; color: var(--ink); }
  #result {
    display: none; background: var(--card); border: 2px solid var(--accent); border-radius: 14px;
    padding: 16px; margin-bottom: 16px; font-size: 1.2rem;
  }
  #result strong { font-size: 1.6rem; }
</style>
</head>
<body>
<main>
  <header><a href="index.html">← Zpět na seznam testů</a></header>
  <h1>Převody jednotek – test 1</h1>
  <p class="sub">Délka (km, m, dm, cm, mm) · Objem (l, ml) · Čas (h, min, s) — celkem 43 bodů</p>

  <div id="test"></div>

  <div id="result"></div>
  <div class="actions">
    <button id="check">Vyhodnotit</button>
    <button id="reset" class="secondary">Začít znovu</button>
  </div>
</main>

<script>
// Test definition. Each section has items; each item has text and answer fields.
// field: {ans: expected answer, unit: text shown after the input}
// type "cmp" = choose <, >, =; type "order" = pick items in order; type "word" = word problem.
const TEST = [
  {
    title: "1. Jednotky délky", points: 1, hint: "Doplň čísla.",
    items: [
      { t: "4 km =", f: [{ ans: "4000", unit: "m" }] },
      { t: "7 m =", f: [{ ans: "700", unit: "cm" }] },
      { t: "3 dm =", f: [{ ans: "300", unit: "mm" }] },
      { t: "5 cm =", f: [{ ans: "50", unit: "mm" }] },
      { t: "6 000 m =", f: [{ ans: "6", unit: "km" }] },
      { t: "80 mm =", f: [{ ans: "8", unit: "cm" }] },
      { t: "2 m =", f: [{ ans: "2000", unit: "mm" }] },
      { t: "450 cm =", f: [{ ans: "45", unit: "dm" }] },
      { t: "1 km =", f: [{ ans: "100000", unit: "cm" }] },
      { t: "3 m 25 cm =", f: [{ ans: "325", unit: "cm" }] },
    ],
  },
  {
    title: "2. Litry a mililitry", points: 1, hint: "1 l = 1 000 ml",
    items: [
      { t: "2 l =", f: [{ ans: "2000", unit: "ml" }] },
      { t: "5 000 ml =", f: [{ ans: "5", unit: "l" }] },
      { t: "1 l 250 ml =", f: [{ ans: "1250", unit: "ml" }] },
      { t: "3 500 ml =", f: [{ ans: "3", unit: "l" }, { ans: "500", unit: "ml" }] },
      { t: "půl litru =", f: [{ ans: "500", unit: "ml" }] },
      { t: "750 ml + 250 ml =", f: [{ ans: "1", unit: "l" }] },
    ],
  },
  {
    title: "3. Jednotky času", points: 1, hint: "1 h = 60 min, 1 min = 60 s",
    items: [
      { t: "3 min =", f: [{ ans: "180", unit: "s" }] },
      { t: "2 h =", f: [{ ans: "120", unit: "min" }] },
      { t: "240 s =", f: [{ ans: "4", unit: "min" }] },
      { t: "1 h =", f: [{ ans: "3600", unit: "s" }] },
      { t: "90 min =", f: [{ ans: "1", unit: "h" }, { ans: "30", unit: "min" }] },
      { t: "1 h 15 min =", f: [{ ans: "75", unit: "min" }] },
      { t: "150 s =", f: [{ ans: "2", unit: "min" }, { ans: "30", unit: "s" }] },
      { t: "čtvrt hodiny =", f: [{ ans: "15", unit: "min" }] },
      { t: "300 min =", f: [{ ans: "5", unit: "h" }] },
    ],
  },
  {
    title: "4. Porovnej", points: 1, hint: "Vyber <, > nebo =.",
    items: [
      { type: "cmp", a: "3 km", b: "2 900 m", ans: ">" },
      { type: "cmp", a: "45 cm", b: "450 mm", ans: "=" },
      { type: "cmp", a: "1 500 ml", b: "2 l", ans: "<" },
      { type: "cmp", a: "2 h", b: "100 min", ans: ">" },
      { type: "cmp", a: "90 s", b: "1 min 30 s", ans: "=" },
      { type: "cmp", a: "6 dm", b: "59 cm", ans: ">" },
    ],
  },
  {
    title: "5. Seřaď od nejmenšího po největší", points: 2, hint: "Vyber hodnoty v pořadí od nejmenší.",
    items: [
      { type: "order", options: ["1 m", "95 cm", "1 020 mm", "9 dm"], ans: ["9 dm", "95 cm", "1 m", "1 020 mm"] },
    ],
  },
  {
    title: "6. Slovní úlohy", points: 2, hint: "Každá úloha za 2 body.",
    items: [
      { type: "word", t: "Petr to má do školy 1 km 200 m. Kolik metrů ujde tam i zpátky?", f: [{ ans: "2400", unit: "m" }] },
      { type: "word", t: "Maminka koupila 2 lahve džusu, v každé je 1 litr. Nalila 4 sklenice po 250 ml. Kolik mililitrů džusu zbylo?", f: [{ ans: "1000", unit: "ml" }] },
      { type: "word", t: "Film začal v 17:45 a trval 1 h 50 min. V kolik hodin skončil?", f: [{ ans: "19:35", unit: "", time: true }] },
      { type: "word", t: "Eva uběhla 3 kola po 400 m. Kolik je to kilometrů a metrů?", f: [{ ans: "1", unit: "km" }, { ans: "200", unit: "m" }] },
      { type: "word", t: "Jirka skákal přes švihadlo 2 minuty a 15 sekund. Kolik je to sekund?", f: [{ ans: "135", unit: "s" }] },
    ],
  },
];

// Grade scale: minimum points for each grade.
const GRADES = [[39, 1], [32, 2], [24, 3], [15, 4], [0, 5]];

const LETTERS = "abcdefghijklmnop";
const root = document.getElementById("test");

// Normalize user input: drop spaces, unify decimal comma, unify time separator.
function norm(v, isTime) {
  let s = String(v).trim().replace(/\s+/g, "").replace(",", ".");
  if (isTime) {
    s = s.replace(/[.h]/g, ":");
    if (/^\d{3,4}$/.test(s)) s = s.slice(0, -2) + ":" + s.slice(-2);
    const m = s.match(/^(\d{1,2}):(\d{2})$/);
    return m ? String(Number(m[1])) + ":" + m[2] : s;
  }
  return s.replace(/^0+(?=\d)/, "");
}

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
  if (text !== undefined) e.textContent = text;
  return e;
}

function addFields(box, fields) {
  fields.forEach((f) => {
    const inp = el("input", {
      type: "text",
      inputmode: f.time ? "text" : "numeric",
      autocomplete: "off",
      placeholder: f.time ? "hh:mm" : "",
    });
    if (f.time) inp.className = "wide";
    f.input = inp;
    box.appendChild(inp);
    if (f.unit) box.appendChild(el("span", {}, f.unit));
  });
}

function render() {
  root.innerHTML = "";
  TEST.forEach((sec) => {
    const s = el("section");
    s.appendChild(el("h2", {}, sec.title));
    if (sec.hint) s.appendChild(el("p", { class: "hint" }, sec.hint));
    const grid = el("div", { class: "grid" });
    sec.items.forEach((it, i) => {
      const box = el("div", { class: "item" + (it.type === "word" ? " word" : "") });
      it.box = box;
      box.appendChild(el("span", { class: "letter" }, LETTERS[i] + ")"));
      if (it.type === "cmp") {
        box.appendChild(el("span", {}, it.a));
        const sel = el("select");
        ["", "<", ">", "="].forEach((o) => sel.appendChild(el("option", { value: o }, o || "?")));
        it.input = sel;
        box.appendChild(sel);
        box.appendChild(el("span", {}, it.b));
      } else if (it.type === "order") {
        box.firstChild.remove();
        it.selects = it.ans.map((_, k) => {
          const sel = el("select");
          sel.style.width = "120px";
          sel.appendChild(el("option", { value: "" }, (k + 1) + "."));
          it.options.forEach((o) => sel.appendChild(el("option", { value: o }, o)));
          box.appendChild(sel);
          if (k < it.ans.length - 1) box.appendChild(el("span", {}, "<"));
          return sel;
        });
      } else if (it.type === "word") {
        box.appendChild(el("p", {}, it.t));
        addFields(box, it.f);
      } else {
        box.appendChild(el("span", {}, it.t));
        addFields(box, it.f);
      }
      grid.appendChild(box);
    });
    if (sec.items.some((it) => it.type === "word" || it.type === "order")) grid.style.gridTemplateColumns = "1fr";
    s.appendChild(grid);
    root.appendChild(s);
  });
}

// Check one item; returns [isCorrect, correctAnswerText].
function checkItem(it) {
  if (it.type === "cmp") return [it.input.value === it.ans, it.ans];
  if (it.type === "order") {
    const ok = it.selects.every((s, k) => s.value === it.ans[k]);
    return [ok, it.ans.join(" < ")];
  }
  const ok = it.f.every((f) => norm(f.input.value, f.time) === norm(f.ans, f.time));
  const txt = it.f.map((f) => f.ans + (f.unit ? " " + f.unit : "")).join(" ");
  return [ok, txt];
}

function evaluate() {
  let score = 0, max = 0;
  TEST.forEach((sec) => {
    sec.items.forEach((it) => {
      max += sec.points;
      const [ok, correct] = checkItem(it);
      it.box.classList.remove("ok", "bad");
      it.box.querySelector(".fix")?.remove();
      it.box.classList.add(ok ? "ok" : "bad");
      if (ok) score += sec.points;
      else it.box.appendChild(el("div", { class: "fix" }, "Správně: " + correct));
    });
  });
  const grade = GRADES.find(([min]) => score >= min)[1];
  const r = document.getElementById("result");
  r.style.display = "block";
  r.innerHTML = "";
  r.append("Výsledek: ", el("strong", {}, score + " / " + max), " bodů · známka ", el("strong", {}, String(grade)));
  r.scrollIntoView({ behavior: "smooth" });
}

document.getElementById("check").addEventListener("click", evaluate);
document.getElementById("reset").addEventListener("click", () => {
  document.getElementById("result").style.display = "none";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

render();
</script>
</body>
</html>
