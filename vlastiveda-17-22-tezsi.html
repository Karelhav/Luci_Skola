<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vlastivěda str. 17–22 – těžší verze</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --ink: #222; --muted: #6b6b6b;
    --accent: #2f6fdd; --ok: #1f9d55; --bad: #d64545; --line: #e3e0d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  header a { color: var(--accent); text-decoration: none; }
  h1 { font-size: 1.6rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  section {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 16px;
  }
  h2 { font-size: 1.15rem; margin: 0 0 4px; }
  .hint { color: var(--muted); font-size: .95rem; margin: 0 0 12px; }
  .item {
    padding: 10px 12px; border-radius: 10px; border: 2px solid transparent; background: #faf9f6;
    margin-bottom: 10px;
  }
  .item.ok { border-color: var(--ok); background: #eefaf2; }
  .item.bad { border-color: var(--bad); background: #fdf0f0; }
  .q { margin: 0 0 8px; font-weight: 600; }
  .opts { display: grid; gap: 6px; }
  .opt {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #ccc; background: #fff; cursor: pointer;
  }
  .opt input { width: 22px; height: 22px; margin: 0; flex: none; }
  .opt.chosen { border-color: var(--accent); background: #eef3fd; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
  .row .term { font-weight: 600; min-width: 110px; }
  input[type=text], select {
    font: inherit; padding: 6px 8px; border: 1px solid #bbb; border-radius: 8px; background: #fff;
  }
  input[type=text] { width: 110px; text-align: center; }
  select { max-width: 100%; }
  .ptag { color: var(--muted); font-weight: 400; font-size: .9rem; }
  input[type=text].word { width: 220px; text-align: left; }
  .fix { margin-top: 6px; color: var(--bad); font-size: .95rem; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 24px; }
  button {
    font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.secondary { background: #e7e4dc; color: var(--ink); }
  #result {
    display: none; background: var(--card); border: 2px solid var(--accent); border-radius: 14px;
    padding: 16px; margin-bottom: 16px; font-size: 1.2rem;
  }
  #result strong { font-size: 1.6rem; }
</style>
</head>
<body>
<main>
  <header><a href="index.html">← Zpět na seznam testů</a></header>
  <h1>Vlastivěda – str. 17–22 (těžší verze)</h1>
  <p class="sub">Pozor: někde je správných odpovědí víc, někde musíš odpověď napsat. Osvícenství · Marie Terezie a Josef II. · Život na vesnici · Manufaktury a parní stroj</p>

  <div id="test"></div>

  <div id="result"></div>
  <div class="actions">
    <button id="check">Vyhodnotit</button>
    <button id="reset" class="secondary">Začít znovu</button>
  </div>
</main>

<script>
// Harder version of the pages 17-22 test.
// type "mc": multiple choice, FIRST option is correct (shuffled on screen).
// type "multi": tick ALL correct options; "ok" = correct ones, "no" = wrong ones. 2 points, all-or-nothing.
// type "text": typed answer; accepted answers compared without diacritics, case, dots and spaces.
// type "match": pick a value for each row; optional "choices" gives a fixed list instead of the row answers.
// type "order": put items in the right order (ans = correct order). 2 points, all-or-nothing.
const TEST = [
  {
    title: "1. Osvícenství a Marie Terezie (str. 17–18)",
    items: [
      { type: "text", q: "Jak se jmenuje doba, ve které lidé věřili v sílu lidského rozumu?",
        ans: ["osvícenství", "osvicenstvi"], word: true },
      { type: "mc", q: "Proč se tomu novému myšlení říkalo právě takhle?",
        opts: ["protože učenci chtěli lidi „osvítit“ – poučit je a vzdělat",
               "protože se tehdy začalo svítit elektřinou",
               "protože se nová myšlenka objevila v době zatmění Slunce",
               "protože se lidé scházeli jen při svíčkách"] },
      { type: "mc", q: "Co osvícenci kritizovali?",
        opts: ["zpátečnictví katolické církve", "povinnou školní docházku", "vědecké objevy", "rovnost všech lidí"] },
      { type: "mc", q: "Která společenská vrstva začala v 18. století prosazovat pokrokovou (kapitalistickou) společnost?",
        opts: ["měšťanstvo", "šlechta", "církev", "poddaní na vesnici"] },
      { type: "mc", q: "Které tvrzení o osvícených panovnících NEPLATÍ?",
        opts: ["zrušili všechny staré zákony a vládli bez zákonů",
               "vydávali nové zákony, vyhlášky a nařízení",
               "prováděli reformy – změny v řízení státu",
               "omezovali moc církve"] },
      { type: "multi", q: "Co zavedla nebo změnila Marie Terezie? Zaškrtni VŠECHNO správné.",
        ok: ["stálé vojsko a stavba pevností", "daně musela platit i šlechta a vrchnost",
             "snížení roboty na 3 dny v týdnu", "zákaz mučení obviněných", "povinná školní docházka"],
        no: ["zrušení nevolnictví", "toleranční patent", "zrušení mnoha klášterů"] },
      { type: "text", q: "Napiš rok, kdy byla zavedena povinná školní docházka.", ans: ["1774"] },
      { type: "mc", q: "Kolik dětí měla Marie Terezie a kolik se jich dožilo dospělosti?",
        opts: ["16 dětí, dospělosti se dožilo 11", "11 dětí, dospělosti se dožilo 6",
               "16 dětí, dospělosti se dožily všechny", "6 dětí, dospělosti se dožily 3"] },
      { type: "mc", q: "Čím byla Marie Terezie na českém trůnu výjimečná?",
        opts: ["byla jedinou ženou na českém královském trůnu", "byla nejmladší panovnicí, nastoupila v 8 letech",
               "vládla jen jeden rok", "jako první panovnice uměla číst"] },
    ],
  },
  {
    title: "2. Josef II. (str. 18)",
    items: [
      { type: "match", q: "Kdo to udělal? Ke každé změně vyber panovníka.",
        choices: ["Marie Terezie", "Josef II."],
        rows: [
          ["zavedení povinné školní docházky", "Marie Terezie"],
          ["toleranční patent", "Josef II."],
          ["snížení roboty na 3 dny", "Marie Terezie"],
          ["zrušení nevolnictví", "Josef II."],
          ["zákaz mučení", "Marie Terezie"],
          ["zákaz klekat před panovníkem", "Josef II."],
        ] },
      { type: "text", q: "Napiš rok, kdy Josef II. vydal toleranční patent a zrušil nevolnictví.", ans: ["1781"] },
      { type: "multi", q: "Co ještě omezil nebo zakázal toleranční patent? Zaškrtni VŠECHNO správné.",
        ok: ["počet různých církevních obřadů a svátků", "vyzvánění při bouřkách"],
        no: ["chození do školy", "slavení Vánoc", "robotu"] },
      { type: "mc", q: "Co Josef II. nechal vybudovat ze zrušených klášterů?",
        opts: ["nemocnice a ústavy pro chudé a sirotky", "zámky pro šlechtu", "kasárna pro vojáky", "továrny"] },
      { type: "mc", q: "Proč nebyl Josef II. oblíbený u císařského dvora?",
        opts: ["protože nenáviděl přehnanou dvorní okázalost", "protože nechtěl vládnout",
               "protože zvýšil robotu", "protože prohrál všechny války"] },
      { type: "mc", q: "Na obrázku v učebnici Josef II. vyorává brázdu. Kde to bylo?",
        opts: ["u Slavíkovic nedaleko Brna", "u Prahy na Bílé hoře", "ve Vídni", "u Českých Budějovic"] },
      { type: "mc", q: "Přinesla osvícenská doba lidem úplnou svobodu?",
        opts: ["ne, jen k ní pootevřela vrátka a umožnila obrození českého národa",
               "ano, všichni byli úplně svobodní a nemuseli robotovat",
               "ne, svoboda se naopak zmenšila",
               "ano, ale jen pro šlechtu"] },
    ],
  },
  {
    title: "3. Život na vesnici (str. 19–21)",
    items: [
      { type: "order", q: "Seřaď obyvatele vesnice od nejbohatšího po nejchudšího.",
        ans: ["sedlák", "rolník", "bezzemek", "čeledín", "žebrák"] },
      { type: "text", q: "Jak se jmenovala nepálená sušená cihla, ze které se stavěly venkovské domy?",
        ans: ["vepřovice", "veprovice"], word: true },
      { type: "text", q: "Jak se jmenuje pole, které se ten rok neobdělávalo a „odpočívalo“?",
        ans: ["úhor", "uhor", "ladem"], word: true },
      { type: "mc", q: "Kolik půdy se při úhorovém systému neobdělávalo?",
        opts: ["jedna třetina", "polovina", "jedna desetina", "všechna půda jednou za 10 let"] },
      { type: "multi", q: "Co patřilo ke dvoru venkovského stavení? Zaškrtni VŠECHNO správné.",
        ok: ["chlévy", "kurník", "komora na hospodářské nářadí", "stodola"],
        no: ["garáž", "kostel", "škola"] },
      { type: "mc", q: "Kde ve světnici spávaly děti?",
        opts: ["na peci a na lavici pod okny", "ve stodole", "v komoře v truhle", "v kurníku"] },
      { type: "mc", q: "Z čeho se jedlo v rodině sedláka?",
        opts: ["všichni jedli z jedné mísy, většinou lžícemi", "každý ze svého porcelánového talíře vidličkou",
               "rukama ze stolu", "každý jedl jindy a sám"] },
      { type: "mc", q: "Co lidé udělali, když upadl kousek chleba na zem?",
        opts: ["uctivě ho zvedli, oprášili a políbili", "dali ho slepicím", "vyhodili ho", "nechali ho ležet pro štěstí"] },
      { type: "multi", q: "Co měli poddaní za povinnosti i po roce 1781? Zaškrtni VŠECHNO správné.",
        ok: ["robotovat na polích vrchnosti", "odevzdávat vrchnosti a panovníkovi díl úrody"],
        no: ["ptát se vrchnosti, jestli se smějí oženit", "chodit každý den do kostela", "pracovat v manufaktuře"] },
      { type: "order", q: "Seřaď, jak se sklízelo obilí – od prvního kroku po poslední.",
        ans: ["žalo se srpy a vázalo do snopů", "stavělo se do mandelů a panáků",
             "svezlo se do stodol", "v zimě se mlátilo cepy", "zrno se čistilo lopatami a síty",
             "skladovalo se v pytlích na sýpkách"] },
    ],
  },
  {
    title: "4. Manufaktury a parní stroj (str. 22)",
    items: [
      { type: "mc", q: "Proč už výroba v řemeslnických dílnách v 18. století nestačila?",
        opts: ["počet obyvatel rostl a předpisy cechů nedovolovaly výrobu zvýšit",
               "řemeslníci odešli do války", "lidé přestali chtít ruční výrobky", "dílny zakázala Marie Terezie"] },
      { type: "mc", q: "Proč dělník v manufaktuře vyrobil víc než řemeslník?",
        opts: ["dělal stále jen jednu část výrobku, a tak získal větší zručnost",
               "pracoval se strojem na elektřinu", "pracoval jen 4 hodiny denně, takže byl odpočatý",
               "výrobky za něj dělaly děti"] },
      { type: "multi", q: "Jaké manufaktury vznikaly po textilních? Zaškrtni VŠECHNO správné.",
        ok: ["na zpracování kůží", "na výrobu keramiky", "na výrobu skla", "na výrobu papíru", "na výrobu zbraní"],
        no: ["na výrobu aut", "na výrobu počítačů"] },
      { type: "mc", q: "Proč se hledal nový pohon strojů místo vody?",
        opts: ["protože ne všude byly řeky", "protože voda byla moc drahá",
               "protože voda stroje rozbíjela", "protože to nařídila církev"] },
      { type: "mc", q: "Proč po zrušení nevolnictví rostl počet obyvatel ve městech?",
        opts: ["venkované bez půdy odcházeli do měst hledat práci v manufakturách",
               "do měst se stěhovala šlechta", "ve městech byla levnější půda", "vesnice byly zbourány"] },
      { type: "order", q: "Seřaď, jak se vyvíjela výroba – od nejstarší po nejnovější.",
        ans: ["řemeslnické dílny", "manufaktury", "továrny s parními stroji"] },
      { type: "text", q: "Jak se jmenoval Skot, který sestrojil první parní stroj?",
        ans: ["James Watt", "Watt", "Džejms Vot"], word: true },
      { type: "mc", q: "První parní lokomotiva v Anglii utáhla…",
        opts: ["8 vagonů rychlostí 6 km za hodinu", "20 vagonů rychlostí 60 km za hodinu",
               "1 vagon rychlostí 100 km za hodinu", "8 vagonů rychlostí 50 km za hodinu"] },
      { type: "mc", q: "Čeho se lidé u prvních vlaků báli?",
        opts: ["že při rychlé jízdě nebude ve vagonech vzduch a nebudou moci dýchat",
               "že vlak vyletí do vzduchu", "že se z páry stane déšť", "že vlak vyplaší všechny krávy v zemi"] },
    ],
  },
];

// Grade scale by percentage of the maximum.
const GRADES = [[0.9, 1], [0.75, 2], [0.5, 3], [0.3, 4], [0, 5]];

const root = document.getElementById("test");

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
  if (text !== undefined) e.textContent = text;
  return e;
}

function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

// Lenient comparison for typed answers: no diacritics, case, dots or spaces.
function norm(s) {
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[\s.]/g, "");
}

function points(it) {
  if (it.type === "match") return it.rows.length;
  if (it.type === "multi" || it.type === "order") return 2;
  return 1;
}

function optionList(container, values, kind, name) {
  return values.map((o) => {
    const lab = el("label", { class: "opt" });
    const r = el("input", { type: kind, name, value: o });
    r.addEventListener("change", () => {
      if (kind === "radio") container.querySelectorAll(".opt").forEach((x) => x.classList.remove("chosen"));
      lab.classList.toggle("chosen", r.checked);
    });
    lab.append(r, el("span", {}, o));
    container.appendChild(lab);
    return r;
  });
}

function render() {
  root.innerHTML = "";
  let qNo = 0;
  TEST.forEach((sec, si) => {
    const s = el("section");
    s.appendChild(el("h2", {}, sec.title));
    sec.items.forEach((it, ii) => {
      qNo++;
      const box = el("div", { class: "item" });
      it.box = box;
      const p = el("p", { class: "q" }, qNo + ". " + it.q + " ");
      const pts = points(it);
      p.appendChild(el("span", { class: "ptag" }, "(" + pts + (pts === 1 ? " bod" : pts < 5 ? " body" : " bodů") + ")"));
      box.appendChild(p);
      const name = "q" + si + "_" + ii;
      if (it.type === "mc") {
        const opts = el("div", { class: "opts" });
        it.inputs = optionList(opts, shuffle(it.opts), "radio", name);
        box.appendChild(opts);
      } else if (it.type === "multi") {
        const opts = el("div", { class: "opts" });
        it.inputs = optionList(opts, shuffle(it.ok.concat(it.no)), "checkbox", name);
        box.appendChild(opts);
      } else if (it.type === "text") {
        it.input = el("input", {
          type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false",
          inputmode: it.word ? "text" : "numeric", placeholder: it.word ? "napiš odpověď" : "rok",
        });
        if (it.word) it.input.className = "word";
        box.appendChild(it.input);
      } else if (it.type === "match") {
        const values = it.choices || shuffle(it.rows.map((r) => r[1]));
        it.selects = it.rows.map(([term]) => {
          const row = el("div", { class: "row" });
          row.appendChild(el("span", { class: "term" }, term + ":"));
          const sel = el("select");
          sel.appendChild(el("option", { value: "" }, "– vyber –"));
          values.forEach((m) => sel.appendChild(el("option", { value: m }, m)));
          row.appendChild(sel);
          box.appendChild(row);
          return sel;
        });
      } else if (it.type === "order") {
        const opts = shuffle(it.ans);
        it.selects = it.ans.map((_, k) => {
          const row = el("div", { class: "row" });
          row.appendChild(el("span", { class: "term" }, (k + 1) + "."));
          const sel = el("select");
          sel.appendChild(el("option", { value: "" }, "– vyber –"));
          opts.forEach((o) => sel.appendChild(el("option", { value: o }, o)));
          row.appendChild(sel);
          box.appendChild(row);
          return sel;
        });
      }
      s.appendChild(box);
    });
    root.appendChild(s);
  });
}

function evaluate() {
  let score = 0, max = 0;
  TEST.forEach((sec) => {
    sec.items.forEach((it) => {
      it.box.classList.remove("ok", "bad");
      it.box.querySelectorAll(".fix").forEach((f) => f.remove());
      const pts = points(it);
      max += pts;
      let ok, fix;
      if (it.type === "mc") {
        const chosen = it.inputs.find((r) => r.checked);
        ok = !!chosen && chosen.value === it.opts[0];
        fix = "Správně: " + it.opts[0];
      } else if (it.type === "multi") {
        const chosen = it.inputs.filter((r) => r.checked).map((r) => r.value);
        ok = chosen.length === it.ok.length && it.ok.every((o) => chosen.includes(o));
        fix = "Správně: " + it.ok.join("; ");
      } else if (it.type === "text") {
        ok = it.ans.some((a) => norm(a) === norm(it.input.value));
        fix = "Správně: " + it.ans[0];
      } else if (it.type === "order") {
        ok = it.selects.every((s, k) => s.value === it.ans[k]);
        fix = "Správně: " + it.ans.join(" → ");
      } else {
        const wrong = [];
        let got = 0;
        it.rows.forEach(([term, val], k) => {
          if (it.selects[k].value === val) got++;
          else wrong.push(term + " = " + val);
        });
        score += got;
        ok = wrong.length === 0;
        fix = "Správně: " + wrong.join("; ");
      }
      if (ok && it.type !== "match") score += pts;
      it.box.classList.add(ok ? "ok" : "bad");
      if (!ok) it.box.appendChild(el("div", { class: "fix" }, fix));
    });
  });
  const grade = GRADES.find(([p]) => score >= Math.ceil(p * max))[1];
  const r = document.getElementById("result");
  r.style.display = "block";
  r.innerHTML = "";
  r.append("Výsledek: ", el("strong", {}, score + " / " + max), " bodů · známka ", el("strong", {}, String(grade)));
  r.scrollIntoView({ behavior: "smooth" });
}

document.getElementById("check").addEventListener("click", evaluate);
document.getElementById("reset").addEventListener("click", () => {
  document.getElementById("result").style.display = "none";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

render();
</script>
</body>
</html>
