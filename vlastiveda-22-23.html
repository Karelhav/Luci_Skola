<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vlastivěda str. 22–23</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --ink: #222; --muted: #6b6b6b;
    --accent: #2f6fdd; --ok: #1f9d55; --bad: #d64545; --line: #e3e0d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  header a { color: var(--accent); text-decoration: none; }
  h1 { font-size: 1.6rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  section {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 16px;
  }
  h2 { font-size: 1.15rem; margin: 0 0 4px; }
  .hint { color: var(--muted); font-size: .95rem; margin: 0 0 12px; }
  .item {
    padding: 10px 12px; border-radius: 10px; border: 2px solid transparent; background: #faf9f6;
    margin-bottom: 10px;
  }
  .item.ok { border-color: var(--ok); background: #eefaf2; }
  .item.bad { border-color: var(--bad); background: #fdf0f0; }
  .q { margin: 0 0 8px; font-weight: 600; }
  .opts { display: grid; gap: 6px; }
  .opt {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #ccc; background: #fff; cursor: pointer;
  }
  .opt input { width: 22px; height: 22px; margin: 0; flex: none; }
  .opt.chosen { border-color: var(--accent); background: #eef3fd; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
  .row .term { font-weight: 600; min-width: 110px; }
  input[type=text], select {
    font: inherit; padding: 6px 8px; border: 1px solid #bbb; border-radius: 8px; background: #fff;
  }
  input[type=text] { width: 110px; text-align: center; }
  select { max-width: 100%; }
  .fix { margin-top: 6px; color: var(--bad); font-size: .95rem; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 24px; }
  button {
    font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.secondary { background: #e7e4dc; color: var(--ink); }
  #result {
    display: none; background: var(--card); border: 2px solid var(--accent); border-radius: 14px;
    padding: 16px; margin-bottom: 16px; font-size: 1.2rem;
  }
  #result strong { font-size: 1.6rem; }
</style>
</head>
<body>
<main>
  <header><a href="index.html">← Zpět na seznam testů</a></header>
  <h1>Vlastivěda – str. 22–23</h1>
  <p class="sub">Manufaktury a parní stroj · Čeští vynálezci · Nová odvětví</p>

  <div id="test"></div>

  <div id="result"></div>
  <div class="actions">
    <button id="check">Vyhodnotit</button>
    <button id="reset" class="secondary">Začít znovu</button>
  </div>
</main>

<script>
// Test definition. Every item is worth 1 point (each row of a "match" item counts separately).
// type "mc": multiple choice, the FIRST option is the correct one (options are shuffled on screen).
// type "text": short typed answer; ans is a list of accepted answers.
// type "match": pick the right meaning for each term from a drop-down.
const TEST = [
  {
    title: "1. Manufaktury a parní stroj (str. 22)",
    items: [
      { type: "mc", q: "Čím se lišila manufaktura od řemeslnické dílny?",
        opts: ["byla to velká dílna, pracovalo v ní víc lidí a každý dělal jen určitou část výrobku",
               "pracoval v ní jen jeden mistr se dvěma učni", "vyráběla se v ní jen jídla", "byla v ní jen parní lokomotiva"] },
      { type: "mc", q: "Proč už výroba v řemeslnických dílnách v 18. století nestačila?",
        opts: ["rostl počet obyvatel a předpisy cechů nedovolovaly výrobu zvýšit",
               "řemeslníci odešli do války", "lidé přestali chtít ruční výrobky", "dílny zakázala Marie Terezie"] },
      { type: "mc", q: "Co byly cechy?",
        opts: ["organizace řemeslníků", "druh látky", "parní stroje", "malé vesnice"] },
      { type: "mc", q: "Na jakou výrobu se soustředilo nejvíce manufaktur?",
        opts: ["na textilní výrobu (látky)", "na výrobu aut", "na výrobu hraček", "na výrobu chleba"] },
      { type: "mc", q: "Kolik hodin denně se v manufakturách pracovalo?",
        opts: ["12–14 hodin", "4 hodiny", "8 hodin", "20 hodin"] },
      { type: "mc", q: "Kdo tvořil většinu pracovníků v manufakturách?",
        opts: ["poddaní, kteří si tak odpracovávali robotu", "šlechtici", "kněží", "vojáci"] },
      { type: "mc", q: "Čím byly poháněny první stroje v manufakturách?",
        opts: ["vodou nebo koňmi", "párou", "elektřinou", "benzínem"] },
      { type: "mc", q: "Proč se hledal nový pohon strojů?",
        opts: ["protože ne všude byly řeky", "protože koně byli moc drazí", "protože voda zamrzala jen v létě", "protože to nařídila církev"] },
      { type: "mc", q: "Co se stalo novým pohonem strojů?",
        opts: ["vodní pára", "vítr", "elektřina", "lidská síla"] },
      { type: "mc", q: "Co nového přinesla tovární výroba?",
        opts: ["parní stroje poháněly celou soustavu jiných strojů – ruční výrobu nahradila strojová velkovýroba",
               "všechno se zase dělalo ručně doma", "v továrnách pracovaly jen děti", "továrny vyráběly jen parní stroje"] },
      { type: "mc", q: "Kde se parní stroje uplatnily nejdříve?",
        opts: ["v textilní výrobě a v dolech na čerpání vody", "v kuchyních", "v kostelích", "v obchodech"] },
      { type: "mc", q: "Jak se často říká 19. století?",
        opts: ["století páry", "století rozumu", "století baroka", "století koní"] },
      { type: "mc", q: "Kdo sestrojil první parní stroj?",
        opts: ["Skot James Watt", "Josef Božek", "Prokop Diviš", "Josef II."] },
      { type: "mc", q: "První parní lokomotiva v Anglii utáhla…",
        opts: ["8 vagonů rychlostí 6 km za hodinu", "20 vagonů rychlostí 60 km za hodinu",
               "1 vagon rychlostí 100 km za hodinu", "8 vagonů rychlostí 50 km za hodinu"] },
    ],
  },
  {
    title: "2. Čeští vynálezci (str. 23)",
    items: [
      { type: "match", q: "Přiřaď k vynálezci jeho vynález:",
        rows: [
          ["James Watt", "první parní stroj"],
          ["F. J. Gerstner", "první parní stroj v českých zemích"],
          ["Josef Božek", "parní automobil a parní loď"],
          ["Josef Ressel", "lodní šroub"],
          ["Prokop Diviš", "uzemněný bleskosvod"],
          ["bratranci Veverkové", "ruchadlo"],
        ] },
      { type: "mc", q: "Kdo byl František Josef Gerstner?",
        opts: ["profesor pražské techniky", "farář", "císař", "sedlák"] },
      { type: "mc", q: "Kdy se Josef Božek projel svým parním vozem po Praze?",
        opts: ["roku 1815", "roku 1620", "roku 1774", "roku 1900"] },
      { type: "mc", q: "Proč Božek parní dopravu opustil?",
        opts: ["byla nad jeho finanční možnosti", "vůz mu ukradli", "zakázal mu to císař", "bál se jezdit"] },
      { type: "mc", q: "Kdo byl Prokop Diviš?",
        opts: ["farář", "profesor pražské techniky", "mechanik", "voják"] },
      { type: "mc", q: "Co dělalo ruchadlo?",
        opts: ["půdu nadzvedávalo a zároveň převracelo", "mlátilo obilí", "sekalo trávu", "sázelo brambory"] },
      { type: "text", q: "Ve kterém roce byla postavena koněspřežná železniční dráha?", ans: ["1832"], ph: "rok" },
      { type: "mc", q: "Odkud kam jezdila koněspřežka?",
        opts: ["z Českých Budějovic do Lince v Rakousku", "z Prahy do Brna", "z Břeclavi do Brna", "z Plzně do Prahy"] },
      { type: "mc", q: "Co táhlo vagony na koněspřežce?",
        opts: ["koně", "parní lokomotiva", "lidé", "voli"] },
      { type: "text", q: "Ve kterém roce byla u nás otevřena první parní železnice?", ans: ["1839"], ph: "rok" },
      { type: "mc", q: "Na kterém úseku jezdila první parní železnice u nás?",
        opts: ["Břeclav–Brno", "České Budějovice–Linec", "Praha–Plzeň", "Praha–Vídeň"] },
    ],
  },
  {
    title: "3. Nová odvětví (str. 23)",
    items: [
      { type: "mc", q: "Jak se přepravovaly suroviny a výrobky před zavedením železnice?",
        opts: ["na vozech tažených koňmi a na lodích po řekách", "letadly", "nákladními auty", "vůbec se nepřepravovaly"] },
      { type: "mc", q: "Co se změnilo díky železnici?",
        opts: ["zrychlila se doprava a rozvinula se výroba i obchod", "lidé přestali cestovat",
               "zanikla všechna města", "zrušila se robota"] },
      { type: "mc", q: "Ve kterém průmyslu se od poloviny 19. století začala uplatňovat strojová výroba?",
        opts: ["v potravinářském – mlynářství, cukrovarnictví, pivovarnictví, lihovarnictví",
               "v počítačovém", "v automobilovém", "v leteckém"] },
      { type: "mc", q: "Co dalšího se v 19. století rozvíjelo?",
        opts: ["výroba železa, strojírenský průmysl a těžba uhlí", "výroba mobilů", "výroba plastů", "těžba zlata v Čechách"] },
      { type: "mc", q: "Odkud přicházeli dělníci do továren?",
        opts: ["z vesnic – usazovali se ve městech", "z hradů a zámků", "z klášterů", "z Ameriky"] },
      { type: "mc", q: "Kdo kromě mužů pracoval v továrnách a byl nejhůř placen?",
        opts: ["ženy a děti", "šlechtici", "učitelé", "vojáci"] },
    ],
  },
];

// Grade scale by percentage of the maximum.
const GRADES = [[0.9, 1], [0.75, 2], [0.5, 3], [0.3, 4], [0, 5]];

const root = document.getElementById("test");

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
  if (text !== undefined) e.textContent = text;
  return e;
}

function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

let qNo = 0;
function render() {
  root.innerHTML = "";
  qNo = 0;
  TEST.forEach((sec, si) => {
    const s = el("section");
    s.appendChild(el("h2", {}, sec.title));
    sec.items.forEach((it, ii) => {
      qNo++;
      const box = el("div", { class: "item" });
      it.box = box;
      box.appendChild(el("p", { class: "q" }, qNo + ". " + it.q));
      if (it.type === "mc") {
        const opts = el("div", { class: "opts" });
        const name = "q" + si + "_" + ii;
        it.radios = shuffle(it.opts).map((o) => {
          const lab = el("label", { class: "opt" });
          const r = el("input", { type: "radio", name, value: o });
          r.addEventListener("change", () => {
            opts.querySelectorAll(".opt").forEach((x) => x.classList.remove("chosen"));
            lab.classList.add("chosen");
          });
          lab.append(r, el("span", {}, o));
          opts.appendChild(lab);
          return r;
        });
        box.appendChild(opts);
      } else if (it.type === "text") {
        it.input = el("input", { type: "text", inputmode: "numeric", autocomplete: "off", placeholder: it.ph || "" });
        box.appendChild(it.input);
      } else if (it.type === "match") {
        const meanings = shuffle(it.rows.map((r) => r[1]));
        it.selects = it.rows.map(([term]) => {
          const row = el("div", { class: "row" });
          row.appendChild(el("span", { class: "term" }, term + ":"));
          const sel = el("select");
          sel.appendChild(el("option", { value: "" }, "– vyber –"));
          meanings.forEach((m) => sel.appendChild(el("option", { value: m }, m)));
          row.appendChild(sel);
          box.appendChild(row);
          return sel;
        });
      }
      s.appendChild(box);
    });
    root.appendChild(s);
  });
}

function evaluate() {
  let score = 0, max = 0;
  TEST.forEach((sec) => {
    sec.items.forEach((it) => {
      it.box.classList.remove("ok", "bad");
      it.box.querySelectorAll(".fix").forEach((f) => f.remove());
      let ok, fix;
      if (it.type === "mc") {
        max += 1;
        const chosen = it.radios.find((r) => r.checked);
        ok = !!chosen && chosen.value === it.opts[0];
        if (ok) score += 1;
        fix = "Správně: " + it.opts[0];
      } else if (it.type === "text") {
        max += 1;
        const v = it.input.value.trim().replace(/\s+/g, "").toLowerCase();
        ok = it.ans.some((a) => a.toLowerCase() === v);
        if (ok) score += 1;
        fix = "Správně: " + it.ans[0];
      } else {
        const wrong = [];
        it.rows.forEach(([term, meaning], k) => {
          max += 1;
          if (it.selects[k].value === meaning) score += 1;
          else wrong.push(term + " = " + meaning);
        });
        ok = wrong.length === 0;
        fix = "Správně: " + wrong.join("; ");
      }
      it.box.classList.add(ok ? "ok" : "bad");
      if (!ok) it.box.appendChild(el("div", { class: "fix" }, fix));
    });
  });
  const grade = GRADES.find(([p]) => score >= Math.ceil(p * max))[1];
  const r = document.getElementById("result");
  r.style.display = "block";
  r.innerHTML = "";
  r.append("Výsledek: ", el("strong", {}, score + " / " + max), " bodů · známka ", el("strong", {}, String(grade)));
  r.scrollIntoView({ behavior: "smooth" });
}

document.getElementById("check").addEventListener("click", evaluate);
document.getElementById("reset").addEventListener("click", () => {
  document.getElementById("result").style.display = "none";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

render();
</script>
</body>
</html>
