<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vlastivěda str. 17–22</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --ink: #222; --muted: #6b6b6b;
    --accent: #2f6fdd; --ok: #1f9d55; --bad: #d64545; --line: #e3e0d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  header a { color: var(--accent); text-decoration: none; }
  h1 { font-size: 1.6rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  section {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 16px;
  }
  h2 { font-size: 1.15rem; margin: 0 0 4px; }
  .hint { color: var(--muted); font-size: .95rem; margin: 0 0 12px; }
  .item {
    padding: 10px 12px; border-radius: 10px; border: 2px solid transparent; background: #faf9f6;
    margin-bottom: 10px;
  }
  .item.ok { border-color: var(--ok); background: #eefaf2; }
  .item.bad { border-color: var(--bad); background: #fdf0f0; }
  .q { margin: 0 0 8px; font-weight: 600; }
  .opts { display: grid; gap: 6px; }
  .opt {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #ccc; background: #fff; cursor: pointer;
  }
  .opt input { width: 22px; height: 22px; margin: 0; flex: none; }
  .opt.chosen { border-color: var(--accent); background: #eef3fd; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
  .row .term { font-weight: 600; min-width: 110px; }
  input[type=text], select {
    font: inherit; padding: 6px 8px; border: 1px solid #bbb; border-radius: 8px; background: #fff;
  }
  input[type=text] { width: 110px; text-align: center; }
  select { max-width: 100%; }
  .fix { margin-top: 6px; color: var(--bad); font-size: .95rem; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 24px; }
  button {
    font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.secondary { background: #e7e4dc; color: var(--ink); }
  #result {
    display: none; background: var(--card); border: 2px solid var(--accent); border-radius: 14px;
    padding: 16px; margin-bottom: 16px; font-size: 1.2rem;
  }
  #result strong { font-size: 1.6rem; }
</style>
</head>
<body>
<main>
  <header><a href="index.html">← Zpět na seznam testů</a></header>
  <h1>Vlastivěda – str. 17–22</h1>
  <p class="sub">Osvícenství · Marie Terezie a Josef II. · Život na vesnici · Manufaktury a parní stroj</p>

  <div id="test"></div>

  <div id="result"></div>
  <div class="actions">
    <button id="check">Vyhodnotit</button>
    <button id="reset" class="secondary">Začít znovu</button>
  </div>
</main>

<script>
// Test definition. Every item is worth 1 point (each row of a "match" item counts separately).
// type "mc": multiple choice, the FIRST option is the correct one (options are shuffled on screen).
// type "text": short typed answer; ans is a list of accepted answers.
// type "match": pick the right meaning for each term from a drop-down.
const TEST = [
  {
    title: "1. Osvícenství a Marie Terezie (str. 17–18)",
    items: [
      { type: "mc", q: "Jak se nazývá nový způsob myšlení, který se v 18. století šířil z Anglie a Francie?",
        opts: ["osvícenství", "baroko", "renesance", "husitství"] },
      { type: "mc", q: "Osvícenci věřili především v…",
        opts: ["sílu lidského rozumu", "moc církve", "sílu vojska", "pověry a čarodějnictví"] },
      { type: "mc", q: "Podle osvícenců mají všichni lidé (bohatí i chudí)…",
        opts: ["stejná práva", "práva podle toho, kolik mají peněz", "žádná práva", "práva jen ve městech"] },
      { type: "mc", q: "Co znamená slovo tolerance?",
        opts: ["snášenlivost a respektování jiného názoru", "přísný trest", "povinná práce na poli", "nový zákon"] },
      { type: "mc", q: "Proč Marie Terezie začala budovat stálé vojsko a stavět pevnosti?",
        opts: ["protože prohrála války s jinými státy", "protože chtěla dobýt Francii", "protože se bála povodní", "protože to chtěla církev"] },
      { type: "mc", q: "Na kolik dní v týdnu snížila Marie Terezie robotu?",
        opts: ["na 3 dny", "na 1 den", "na 5 dní", "zrušila ji úplně"] },
      { type: "mc", q: "Kdo musel za Marie Terezie nově platit daně?",
        opts: ["i šlechta a vrchnost", "jen děti", "nikdo, daně zrušila", "jen kněží"] },
      { type: "mc", q: "Co Marie Terezie zakázala úředníkům?",
        opts: ["mučit obviněné", "nosit paruky", "chodit do kostela", "jezdit kočárem"] },
      { type: "text", q: "Ve kterém roce zavedla Marie Terezie povinnou školní docházku?", ans: ["1774"], ph: "rok" },
      { type: "mc", q: "Pro děti v jakém věku platila povinná školní docházka?",
        opts: ["od 6 do 12 let", "od 3 do 6 let", "od 10 do 18 let", "jen pro chlapce od 8 let"] },
      { type: "mc", q: "V kterých letech vládla Marie Terezie?",
        opts: ["1740–1780", "1618–1648", "1781–1800", "1592–1670"] },
    ],
  },
  {
    title: "2. Josef II. (str. 18)",
    items: [
      { type: "mc", q: "Kdo byl Josef II.?",
        opts: ["nejstarší syn Marie Terezie", "manžel Marie Terezie", "otec Marie Terezie", "český vynálezce"] },
      { type: "text", q: "Ve kterém roce vydal Josef II. toleranční patent a zrušil nevolnictví?", ans: ["1781"], ph: "rok" },
      { type: "mc", q: "Co povolil toleranční patent?",
        opts: ["vyznávat i jiná náboženství než katolické", "nechodit do školy", "neplatit daně", "kácet panské lesy"] },
      { type: "mc", q: "Co mohli poddaní po zrušení nevolnictví dělat bez svolení vrchnosti?",
        opts: ["stěhovat se, ženit se a posílat děti do učení", "přestat robotovat", "stát se šlechtici", "nosit paruky"] },
      { type: "mc", q: "Co museli poddaní dělat i po zrušení nevolnictví?",
        opts: ["robotovat (pracovat na poli vrchnosti)", "chodit do války", "stavět kláštery", "nic, byli úplně svobodní"] },
      { type: "mc", q: "Které kláštery Josef II. nezrušil?",
        opts: ["ty, kde mniši ošetřovali nemocné nebo učili mládež", "ty nejbohatší", "ty v Praze", "žádný, zrušil všechny"] },
      { type: "mc", q: "Jak se Josefu II. říkalo, protože ulehčil život na vesnici?",
        opts: ["selský císař", "železný král", "otec vlasti", "král železný a zlatý"] },
    ],
  },
  {
    title: "3. Život na vesnici (str. 19–21)",
    items: [
      { type: "mc", q: "Podle čeho se dělili lidé na vesnici?",
        opts: ["podle majetku – kolik měli půdy a dobytka", "podle věku", "podle toho, jak uměli číst", "podle barvy vlasů"] },
      { type: "mc", q: "Kdo byli bezzemci?",
        opts: ["pronajímali si kousek půdy od sedláků nebo od obce", "nejbohatší sedláci", "šlechtici", "vojáci"] },
      { type: "mc", q: "Za co pracovali čeledíni a děvečky u sedláka?",
        opts: ["za stravu a byt", "za velký plat", "zadarmo pro vrchnost", "za kus pole"] },
      { type: "match", q: "Přiřaď ke slovu správný význam:",
        rows: [
          ["došky", "svazky slámy, kterými se kryla střecha"],
          ["vepřovice", "nepálená sušená cihla"],
          ["kurník", "příbytek pro drůbež"],
          ["stodola", "budova na uskladnění slámy a sena"],
          ["světnice", "kuchyně – největší obytná místnost"],
          ["úhor", "pole, které se ten rok neobdělávalo"],
        ] },
      { type: "mc", q: "Co tvořilo „svatý kout“ ve světnici?",
        opts: ["stůl s obrázky svatých a křížkem", "pec", "postel s peřinami", "truhla na oblečení"] },
      { type: "mc", q: "Který pokrm se jedl nejčastěji (ráno, v poledne i večer)?",
        opts: ["polévka", "maso", "pizza", "ryby"] },
      { type: "mc", q: "Co lidé v českých zemích v 18. století ještě neznali?",
        opts: ["kávu a čaj", "chléb", "luštěniny", "kaše"] },
      { type: "mc", q: "Co nosili muži i ženy z bohatých vrstev?",
        opts: ["paruky", "kroj", "dřeváky", "čepice z kůže"] },
      { type: "mc", q: "Co bylo největším svátkem celé vesnice?",
        opts: ["hody neboli posvícení", "draní peří", "Den matek", "dožínky v zimě"] },
      { type: "mc", q: "Co bylo draní peří?",
        opts: ["zimní setkávání žen, při kterém se vyprávělo a zpívalo", "jarní práce na poli", "hra dětí o Velikonocích", "trh ve městě"] },
      { type: "mc", q: "Co znamenal úhorový systém?",
        opts: ["třetina půdy se neobdělávala, aby si odpočinula", "pole se zalévala vodou", "na polích se pěstovaly jen brambory", "pole se obdělávala stroji"] },
      { type: "mc", q: "Čím se v zimě mlátilo obilí?",
        opts: ["cepy", "kosou", "pluhem", "kladivem"] },
    ],
  },
  {
    title: "4. Manufaktury a parní stroj (str. 22)",
    items: [
      { type: "mc", q: "Čím se manufaktura lišila od řemeslnické dílny?",
        opts: ["byla větší, pracovalo v ní víc lidí a každý dělal jen určitou část výrobku",
               "pracoval v ní jen jeden mistr", "vyráběla se v ní jen jídla", "poháněly ji elektromotory"] },
      { type: "mc", q: "Nejvíce manufaktur se zabývalo výrobou…",
        opts: ["textilu (látek)", "aut", "zbraní", "hraček"] },
      { type: "mc", q: "Kolik hodin denně pracovali lidé v manufakturách?",
        opts: ["12–14 hodin", "4 hodiny", "8 hodin", "20 hodin"] },
      { type: "mc", q: "Co byly cechy?",
        opts: ["organizace řemeslníků", "druh látky", "stroje na páru", "malé vesnice"] },
      { type: "mc", q: "Čím byly poháněny úplně první stroje?",
        opts: ["vodou nebo koňmi", "párou", "elektřinou", "benzínem"] },
      { type: "mc", q: "Kdo sestrojil první parní stroj?",
        opts: ["James Watt", "Josef Ressel", "Prokop Diviš", "Josef II."] },
      { type: "mc", q: "Jak se často říká 19. století?",
        opts: ["století páry", "století rozumu", "století baroka", "století koní"] },
      { type: "mc", q: "Kde se parní stroje uplatnily nejdříve?",
        opts: ["v textilní výrobě a v dolech na čerpání vody", "v kuchyních", "v kostelích", "na polích při žních"] },
    ],
  },
];

// Grade scale by percentage of the maximum.
const GRADES = [[0.9, 1], [0.75, 2], [0.5, 3], [0.3, 4], [0, 5]];

const root = document.getElementById("test");

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
  if (text !== undefined) e.textContent = text;
  return e;
}

function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

let qNo = 0;
function render() {
  root.innerHTML = "";
  qNo = 0;
  TEST.forEach((sec, si) => {
    const s = el("section");
    s.appendChild(el("h2", {}, sec.title));
    sec.items.forEach((it, ii) => {
      qNo++;
      const box = el("div", { class: "item" });
      it.box = box;
      box.appendChild(el("p", { class: "q" }, qNo + ". " + it.q));
      if (it.type === "mc") {
        const opts = el("div", { class: "opts" });
        const name = "q" + si + "_" + ii;
        it.radios = shuffle(it.opts).map((o) => {
          const lab = el("label", { class: "opt" });
          const r = el("input", { type: "radio", name, value: o });
          r.addEventListener("change", () => {
            opts.querySelectorAll(".opt").forEach((x) => x.classList.remove("chosen"));
            lab.classList.add("chosen");
          });
          lab.append(r, el("span", {}, o));
          opts.appendChild(lab);
          return r;
        });
        box.appendChild(opts);
      } else if (it.type === "text") {
        it.input = el("input", { type: "text", inputmode: "numeric", autocomplete: "off", placeholder: it.ph || "" });
        box.appendChild(it.input);
      } else if (it.type === "match") {
        const meanings = shuffle(it.rows.map((r) => r[1]));
        it.selects = it.rows.map(([term]) => {
          const row = el("div", { class: "row" });
          row.appendChild(el("span", { class: "term" }, term + ":"));
          const sel = el("select");
          sel.appendChild(el("option", { value: "" }, "– vyber –"));
          meanings.forEach((m) => sel.appendChild(el("option", { value: m }, m)));
          row.appendChild(sel);
          box.appendChild(row);
          return sel;
        });
      }
      s.appendChild(box);
    });
    root.appendChild(s);
  });
}

function evaluate() {
  let score = 0, max = 0;
  TEST.forEach((sec) => {
    sec.items.forEach((it) => {
      it.box.classList.remove("ok", "bad");
      it.box.querySelectorAll(".fix").forEach((f) => f.remove());
      let ok, fix;
      if (it.type === "mc") {
        max += 1;
        const chosen = it.radios.find((r) => r.checked);
        ok = !!chosen && chosen.value === it.opts[0];
        if (ok) score += 1;
        fix = "Správně: " + it.opts[0];
      } else if (it.type === "text") {
        max += 1;
        const v = it.input.value.trim().replace(/\s+/g, "").toLowerCase();
        ok = it.ans.some((a) => a.toLowerCase() === v);
        if (ok) score += 1;
        fix = "Správně: " + it.ans[0];
      } else {
        const wrong = [];
        it.rows.forEach(([term, meaning], k) => {
          max += 1;
          if (it.selects[k].value === meaning) score += 1;
          else wrong.push(term + " = " + meaning);
        });
        ok = wrong.length === 0;
        fix = "Správně: " + wrong.join("; ");
      }
      it.box.classList.add(ok ? "ok" : "bad");
      if (!ok) it.box.appendChild(el("div", { class: "fix" }, fix));
    });
  });
  const grade = GRADES.find(([p]) => score >= Math.ceil(p * max))[1];
  const r = document.getElementById("result");
  r.style.display = "block";
  r.innerHTML = "";
  r.append("Výsledek: ", el("strong", {}, score + " / " + max), " bodů · známka ", el("strong", {}, String(grade)));
  r.scrollIntoView({ behavior: "smooth" });
}

document.getElementById("check").addEventListener("click", evaluate);
document.getElementById("reset").addEventListener("click", () => {
  document.getElementById("result").style.display = "none";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

render();
</script>
</body>
</html>
